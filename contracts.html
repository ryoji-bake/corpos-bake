<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorpOS — 契約・法務管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f; --surface: #111318; --surface2: #181b22; --surface3: #1e2230;
    --border: #252a38; --accent: #4f6ef7; --accent2: #7c3aed; --accent3: #059669;
    --accent4: #d97706; --text: #e8eaf0; --text2: #8891a8; --text3: #555e76;
    --danger: #ef4444; --glow: rgba(79,110,247,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; }

  /* AUTH LOADING */
  #auth-loading {
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:999; flex-direction:column; gap:16px;
  }
  .auth-logo {
    width:48px; height:48px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-family:'Syne',sans-serif; font-weight:800; font-size:16px; color:white;
    box-shadow:0 0 24px rgba(79,110,247,0.4);
  }
  .auth-spinner {
    width:24px; height:24px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg);} }

  .sidebar { width:64px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:20px 0; gap:8px; flex-shrink:0; }
  .logo { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:14px; color:white; margin-bottom:16px; box-shadow:0 0 20px rgba(79,110,247,0.4); }
  .nav-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; color:var(--text3); font-size:18px; }
  .nav-icon:hover { background:var(--surface3); color:var(--text); }
  .nav-icon.active { background:var(--glow); color:var(--accent); }
  .nav-divider { width:32px; height:1px; background:var(--border); margin:8px 0; }
  .sidebar-bottom { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#4f6ef7,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:white; border:2px solid var(--border); cursor:pointer; position:relative; }

  /* USER MENU */
  .user-menu {
    position:absolute; bottom:50px; left:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:8px; min-width:180px; z-index:50;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    display:none;
  }
  .user-menu.open { display:block; }
  .user-email { font-size:11px; color:var(--text3); padding:6px 10px; border-bottom:1px solid var(--border); margin-bottom:4px; word-break:break-all; }
  .user-menu-item { padding:8px 10px; border-radius:6px; font-size:12px; cursor:pointer; color:var(--text2); transition:all 0.15s; }
  .user-menu-item:hover { background:var(--surface3); color:var(--text); }
  .user-menu-item.danger { color:#f87171; }
  .user-menu-item.danger:hover { background:rgba(239,68,68,0.1); }

  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; height:100vh; }
  .topbar { height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px; flex-shrink:0; }
  .breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; }
  .breadcrumb .sep { color:var(--text3); }
  .breadcrumb .current { color:var(--text); font-weight:600; font-family:'Syne',sans-serif; }
  .breadcrumb a { color:var(--text3); text-decoration:none; }
  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }

  .btn { padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all 0.2s; font-family:inherit; }
  .btn-primary { background:var(--accent); color:white; box-shadow:0 0 16px rgba(79,110,247,0.25); }
  .btn-primary:hover { background:#6b83f8; }
  .btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--surface3); color:var(--text); }
  .btn-danger { background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.2); }
  .btn-danger:hover { background:rgba(239,68,68,0.2); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .body-layout { flex:1; display:flex; overflow:hidden; min-height:0; }

  .list-panel { width:300px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; background:var(--surface); }
  .list-header { padding:14px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .list-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
  .count-badge { background:var(--surface3); color:var(--text2); font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; }
  .search-input { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 12px; }
  .search-input input { background:none; border:none; outline:none; color:var(--text); font-size:13px; font-family:inherit; width:100%; }
  .search-input input::placeholder { color:var(--text3); }
  .filter-tabs { display:flex; flex-direction:column; gap:0; padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .filter-row { display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
  .filter-label { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; margin-right:4px; white-space:nowrap; min-width:42px; }
  .filter-divider { height:1px; background:var(--border); margin:6px 0; }
  .filter-tab { padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; color:var(--text3); transition:all 0.15s; }
  .filter-tab:hover { color:var(--text2); background:var(--surface3); }
  .filter-tab.active { background:var(--glow); color:var(--accent); }
  .list-scroll { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

  .contract-item { padding:12px 14px; border-bottom:1px solid rgba(37,42,56,0.6); cursor:pointer; transition:background 0.15s; display:flex; gap:10px; align-items:flex-start; }
  .contract-item:hover { background:var(--surface2); }
  .contract-item.selected { background:rgba(79,110,247,0.08); border-left:2px solid var(--accent); padding-left:12px; }
  .contract-item.child { padding-left:28px; border-left:2px solid var(--border); }
  .contract-item.child.selected { border-left-color:var(--accent); }
  .ci-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .ci-body { flex:1; min-width:0; }
  .ci-name { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ci-partner { font-size:11px; color:var(--text3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ci-meta { display:flex; align-items:center; gap:5px; margin-top:5px; }
  .ci-type { font-size:10px; color:var(--text3); background:var(--surface3); padding:1px 6px; border-radius:4px; }

  .status-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:20px; font-size:10px; font-weight:600; }
  .status-pill::before { content:''; width:4px; height:4px; border-radius:50%; background:currentColor; }
  .pill-green { background:rgba(5,150,105,0.12); color:#34d399; }
  .pill-blue { background:rgba(79,110,247,0.12); color:#818cf8; }
  .pill-orange { background:rgba(217,119,6,0.12); color:#fbbf24; }
  .pill-red { background:rgba(239,68,68,0.12); color:#f87171; }
  .pill-gray { background:rgba(85,94,118,0.15); color:var(--text2); }
  .pill-purple { background:rgba(124,58,237,0.12); color:#a78bfa; }
  .ci-date { font-size:10px; color:var(--text3); margin-left:auto; white-space:nowrap; }
  .ci-date.urgent { color:var(--accent4); font-weight:600; }
  .ci-date.expired { color:var(--danger); font-weight:600; }

  .detail-panel { flex:1; overflow-y:auto; padding:24px 28px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--text3); }
  .empty-state .icon { font-size:48px; opacity:0.4; }

  .reminder-card { border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .reminder-orange { background:rgba(217,119,6,0.08); border:1px solid rgba(217,119,6,0.25); }
  .reminder-red { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); }
  .reminder-title { font-size:13px; font-weight:600; margin-bottom:2px; }
  .reminder-desc { font-size:12px; color:var(--text2); }

  .detail-hero { display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }
  .detail-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; background:rgba(124,58,237,0.12); flex-shrink:0; border:1px solid rgba(124,58,237,0.2); }
  .detail-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; letter-spacing:-0.5px; margin-bottom:5px; }
  .detail-sub { font-size:12px; color:var(--text2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail-actions { margin-left:auto; display:flex; gap:8px; align-items:flex-start; flex-shrink:0; }

  .info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .info-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .info-label { font-size:10px; color:var(--text3); font-weight:500; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }
  .info-val { font-size:13px; font-weight:600; }
  .info-val.warning { color:var(--accent4); }
  .info-val.danger { color:var(--danger); }
  .info-val.accent { color:var(--accent); }

  .section { margin-bottom:22px; }
  .section-title { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  .upload-zone { border:2px dashed var(--border); border-radius:12px; padding:28px; text-align:center; cursor:pointer; transition:all 0.2s; position:relative; }
  .upload-zone:hover, .upload-zone.dragover { border-color:var(--accent); background:var(--glow); }
  .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; }
  .upload-zone .icon { font-size:32px; margin-bottom:8px; }
  .upload-zone p { font-size:13px; color:var(--text2); }

  .pdf-viewer { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .pdf-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .pdf-filename { font-size:13px; font-weight:500; flex:1; }
  .pdf-embed { width:100%; height:900px; border:none; background:#fff; }

  .children-list { display:flex; flex-direction:column; gap:8px; }
  .child-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:border-color 0.15s; }
  .child-card:hover { border-color:var(--accent); }
  .child-card-name { font-size:13px; font-weight:500; }
  .child-card-meta { font-size:11px; color:var(--text3); margin-top:2px; }
  .add-child-btn { border:1px dashed var(--border); border-radius:10px; padding:10px 16px; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text3); font-size:12px; transition:all 0.15s; background:transparent; font-family:inherit; width:100%; }
  .add-child-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--glow); }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:560px; max-height:88vh; overflow-y:auto; padding:28px; scrollbar-width:thin; animation:modalIn 0.2s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(0.97) translateY(8px);}to{opacity:1;transform:none;} }
  .modal-title { font-family:'Syne',sans-serif; font-size:17px; font-weight:800; margin-bottom:20px; }

  .modal-upload-zone { border:2px dashed var(--border); border-radius:10px; padding:20px; text-align:center; cursor:pointer; transition:all 0.2s; position:relative; margin-bottom:16px; }
  .modal-upload-zone:hover { border-color:var(--accent); background:var(--glow); }
  .modal-upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; }

  .form-group { margin-bottom:14px; }
  .form-label { font-size:12px; color:var(--text2); font-weight:600; margin-bottom:5px; display:block; }
  .form-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:border-color 0.2s; }
  .form-input:focus { border-color:var(--accent); }
  .form-select { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:13px; font-family:inherit; outline:none; cursor:pointer; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:14px; border-top:1px solid var(--border); }

  .toast { position:fixed; bottom:24px; right:24px; z-index:200; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 18px; font-size:13px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 32px rgba(0,0,0,0.4); animation:toastIn 0.3s ease; }
  @keyframes toastIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;} }
  .toast.success { border-color:rgba(5,150,105,0.3); }
  .toast.error { border-color:rgba(239,68,68,0.3); }

  .loading { display:flex; align-items:center; justify-content:center; height:100%; gap:10px; color:var(--text3); font-size:13px; }
  .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }

  /* Sort row */
  .sort-row { display:flex; align-items:center; gap:3px; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sort-tab { padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; color:var(--text3); transition:all 0.15s; }
  .sort-tab:hover { color:var(--text2); background:var(--surface3); }
  .sort-tab.active { background:var(--glow); color:var(--accent); }

  /* Table view */
  .table-wrap { width:100%; overflow-x:auto; }
  .contracts-table { width:100%; border-collapse:collapse; font-size:12px; }
  .contracts-table th { padding:8px 12px; text-align:left; font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.6px; border-bottom:2px solid var(--border); white-space:nowrap; background:var(--surface); position:sticky; top:0; z-index:1; }
  .contracts-table td { padding:10px 12px; border-bottom:1px solid rgba(37,42,56,0.4); vertical-align:middle; }
  .contracts-table tbody tr:hover td { background:var(--surface2); cursor:pointer; }
  .contracts-table tbody tr.table-selected td { background:rgba(79,110,247,0.08); }
  .text-danger { color:var(--danger); font-weight:600; }
  .text-warning { color:var(--accent4); font-weight:600; }

  .mobile-back { display:none; }

  @media (max-width: 768px) {
    body { flex-direction:column; height:auto; min-height:100vh; }

    /* サイドバー → ボトムナビ */
    .sidebar {
      position:fixed; bottom:0; left:0; right:0;
      width:100%; height:52px; flex-direction:row;
      justify-content:space-around; padding:0 12px;
      border-right:none; border-top:1px solid var(--border);
      z-index:50; overflow:visible;
    }
    .logo { display:none; }
    .nav-divider { display:none; }
    .sidebar-bottom { margin-top:0; flex-direction:row; margin-left:auto; }
    .user-menu { bottom:52px; left:auto; right:0; }

    /* メインエリア */
    .main { flex:1; height:auto; overflow-y:auto; padding-bottom:52px; }
    .topbar { padding:0 12px; gap:8px; height:48px; }
    .topbar-right { gap:6px; }
    #view-toggle-btn { display:none; }
    .btn { padding:6px 10px; font-size:12px; }

    /* ボディレイアウト */
    .body-layout { flex-direction:column; overflow:visible; min-height:0; }

    /* リストパネル */
    .list-panel { width:100%; border-right:none; border-bottom:1px solid var(--border); }
    .list-scroll { max-height:38vh; }

    /* 詳細パネル */
    .detail-panel { padding:14px; }
    .info-grid { grid-template-columns:1fr 1fr; }
    .detail-hero { flex-wrap:wrap; gap:12px; }
    .detail-actions { width:100%; justify-content:flex-end; margin-left:0; }
    .pdf-embed { height:400px; }

    /* モーダル */
    .modal { width:calc(100vw - 24px); max-height:90vh; padding:18px; }
    .form-row { grid-template-columns:1fr; }

    /* スマホ: 詳細全画面モード */
    body.mobile-detail .list-panel { display:none; }
    body.mobile-detail .detail-panel { min-height:calc(100vh - 48px - 52px); }
    .mobile-back { display:inline-flex; margin-bottom:14px; font-size:12px; }
  }
</style>
</head>
<body>

<!-- AUTH LOADING -->
<div id="auth-loading">
  <div class="auth-logo">CO</div>
  <div class="auth-spinner"></div>
</div>

<nav class="sidebar">
  <div class="logo">CO</div>
  <div class="nav-icon">⊞</div>
  <div class="nav-icon">👤</div>
  <div class="nav-icon">💴</div>
  <div class="nav-icon">📋</div>
  <div class="nav-icon active">📄</div>
  <div class="nav-divider"></div>
  <div class="nav-icon">⚙</div>
  <div class="sidebar-bottom">
    <div class="avatar" id="user-avatar" onclick="toggleUserMenu()">
      <div class="user-menu" id="user-menu">
        <div class="user-email" id="user-email-display">—</div>
        <div class="user-menu-item danger" onclick="handleLogout()">🚪 ログアウト</div>
      </div>
    </div>
  </div>
</nav>

<div class="main">
  <header class="topbar">
    <div class="breadcrumb">
      <a>CorpOS</a><span class="sep">›</span>
      <span class="current">契約・法務管理</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="exportCSV()">📤 CSV出力</button>
      <button class="btn btn-ghost" id="view-toggle-btn" onclick="toggleViewMode()">📋 テーブル表示</button>
      <button class="btn btn-primary" onclick="openModal()">＋ 新規契約</button>
    </div>
  </header>

  <div class="body-layout">
    <div class="list-panel">
      <div class="list-header">
        <div class="list-title">契約一覧 <span class="count-badge" id="count-badge">—</span></div>
        <div class="search-input">
          <span style="color:var(--text3)">🔍</span>
          <input type="text" id="search-input" placeholder="検索..." oninput="renderList()">
        </div>
      </div>
      <div class="filter-tabs">
        <div class="filter-row">
        <span class="filter-label">ステータス</span>
        <div class="filter-tab active" onclick="setFilter('all',this)">すべて</div>
        <div class="filter-tab" onclick="setFilter('有効',this)">有効</div>
        <div class="filter-tab" onclick="setFilter('更新要',this)">更新要</div>
        <div class="filter-tab" onclick="setFilter('期限切れ',this)">期限切れ</div>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-row">
        <span class="filter-label">カテゴリ</span>
        <div class="filter-tab" onclick="setFilter('賃貸契約類',this)">賃貸契約類</div>
        <div class="filter-tab" onclick="setFilter('その他契約類',this)">その他契約類</div>
      </div>
      </div>
      <div class="sort-row">
        <span class="filter-label">並替</span>
        <div class="sort-tab active" data-label="登録順" onclick="setSort('created_at',this)">登録順 ▼</div>

let allContracts = [];

let currentFilter = 'all';
let currentCategory = null;

// ── DATA ──
async function loadContracts() {
  const { data, error } = await db.from('contracts').select('*').order('created_at', { ascending: false });
  if (error) { showToast('読み込み失敗', 'error'); return; }

  renderList();
  if (selectedId) {
    const c = allContracts.find(x => x.id === selectedId);
    if (c) renderDetail(c);
  }
}

// ── FILTER / SORT ──
function getFilteredSorted() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let arr = allContracts.filter(c => {
    const ms_filter = currentFilter === 'all' || c.status === currentFilter;
    const mc = !currentCategory || c.category === currentCategory;
    const msearch = !q || [c.name, c.partner, c.assignee, c.contract_id, c.notes, c.contract_type]
      .some(v => (v||'').toLowerCase().includes(q));
    return ms_filter && mc && msearch;
  });
  arr.sort((a, b) => {
    let va = a[sortBy], vb = b[sortBy];
    if (sortBy === 'amount') { va = va||0; vb = vb||0; }
    else if (['end_date','created_at'].includes(sortBy)) {
      const inf = sortDir === 'asc' ? '9999' : '0';
      va = va ? new Date(va) : new Date(inf);
      vb = vb ? new Date(vb) : new Date(inf);
    } else { va = (va||'').toLowerCase(); vb = (vb||'').toLowerCase(); }
    return va < vb ? (sortDir==='asc'?-1:1) : va > vb ? (sortDir==='asc'?1:-1) : 0;
  });
  return arr;
}

function renderList() {
  const filtered = getFilteredSorted();
  document.getElementById('count-badge').textContent = filtered.length + '件';

  if (viewMode === 'table') { renderTable(filtered); return; }

  if (filtered.length === 0) {
    document.getElementById('contract-list').innerHTML = '<div style="padding:28px;text-align:center;color:var(--text3);font-size:13px">該当なし</div>';
    return;
  }

  const filteredIds = new Set(filtered.map(c => c.id));
  const shown = new Set();
  let html = '';
  filtered.forEach(c => {
    if (shown.has(c.id)) return;
    if (!c.parent_id) {
      html += contractItemHTML(c, false);
      shown.add(c.id);
      allContracts.filter(x => x.parent_id === c.id && filteredIds.has(x.id)).forEach(ch => {
        html += contractItemHTML(ch, true); shown.add(ch.id);
      });
    }
  });
  filtered.forEach(c => { if (!shown.has(c.id)) { html += contractItemHTML(c, true); shown.add(c.id); } });
  document.getElementById('contract-list').innerHTML = html;
}

function contractItemHTML(c, isChild) {
  const daysLeft = daysUntil(c.end_date);
  const dateLabel = c.end_date ? formatDateShort(c.end_date) : '—';
  const dateClass = daysLeft !== null && daysLeft < 0 ? 'expired' : daysLeft !== null && daysLeft <= 30 ? 'urgent' : '';
  return `
  <div class="contract-item ${isChild?'child':''} ${c.id===selectedId?'selected':''}" onclick="selectContract('${c.id}')">
    ${isChild?'<span style="color:var(--text3);font-size:11px;margin-right:2px">└</span>':''}
    <div class="ci-icon" style="background:${statusBg(c.status)}">${statusIcon(c.status)}</div>
    <div class="ci-body">
      <div class="ci-name">${c.name}</div>
      <div class="ci-partner">${c.partner||'—'}</div>
      <div class="ci-meta">
        <span class="ci-type">${c.category||''}</span>
        <span class="ci-type">${c.contract_type||'基本契約'}</span>
        <span class="status-pill ${statusPill(c.status)}">${c.status}</span>
        <span class="ci-date ${dateClass}">${dateLabel}</span>
      </div>
    </div>
  </div>`;
}

function setFilter(val, el) {
  const statusVals = ['all','有効','更新要','期限切れ'];
  if (statusVals.includes(val)) {
    currentFilter = val;
    document.querySelectorAll('.filter-row:first-child .filter-tab').forEach(t => t.classList.remove('active'));
  } else {
    currentCategory = currentCategory === val ? null : val;
    document.querySelectorAll('.filter-row:last-child .filter-tab').forEach(t => t.classList.remove('active'));
    if (currentCategory) el.classList.add('active');
    renderList(); return;
  }
  el.classList.add('active');
  renderList();
}

function setSort(field, el) {
  if (sortBy === field) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortBy = field;
    sortDir = field === 'created_at' ? 'desc' : 'asc';
  }
  document.querySelectorAll('.sort-tab').forEach(t => {
    t.classList.remove('active');
    if (t.dataset.label) t.textContent = t.dataset.label;
  });
  el.classList.add('active');
  el.textContent = el.dataset.label + (sortDir === 'asc' ? ' ▲' : ' ▼');
  renderList();
}

function selectContract(id) {
  selectedId = id;
  if (viewMode === 'table') {
    viewMode = 'detail';
    document.getElementById('view-toggle-btn').textContent = '📋 テーブル表示';

  if (window.innerWidth <= 768) document.body.classList.add('mobile-detail');
  renderList();
  const c = allContracts.find(x => x.id === id);

function toggleViewMode() {

function renderTable(filtered) {
  if (!filtered) filtered = getFilteredSorted();
  if (filtered.length === 0) {
    document.getElementById('detail-panel').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>該当する契約がありません</p></div>';
    return;
  }
  const rows = filtered.map(c => {
    const daysLeft = daysUntil(c.end_date);
    const isExpired = daysLeft !== null && daysLeft < 0;
    const isUrgent = daysLeft !== null && daysLeft >= 0 && daysLeft <= 30;
    const daysStr = daysLeft === null ? '—' : isExpired ? `${Math.abs(daysLeft)}日超過` : `${daysLeft}日`;
    return `<tr onclick="selectContractFromTable('${c.id}')" ${c.id===selectedId?'class="table-selected"':''}>
      <td><span class="status-pill ${statusPill(c.status)}" style="margin-right:6px">${c.status}</span>${c.name}</td>
      <td>${c.partner||'—'}</td>
      <td><span class="ci-type">${c.contract_type||'基本契約'}</span></td>
      <td><span class="ci-type">${c.category||'—'}</span></td>
      <td>${c.start_date?formatDate(c.start_date):'—'}</td>
      <td class="${isExpired?'text-danger':isUrgent?'text-warning':''}">${c.end_date?formatDate(c.end_date):'—'}</td>
      <td class="${isExpired?'text-danger':isUrgent?'text-warning':''}">${daysStr}</td>
      <td>${c.amount?'¥'+c.amount.toLocaleString():'—'}</td>
      <td>${c.assignee||'—'}</td>
      <td style="font-size:11px;color:var(--text3)">${c.contract_id||'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('detail-panel').innerHTML = `
    <div class="table-wrap">
      <table class="contracts-table">
        <thead><tr>
          <th>契約名</th><th>契約者</th><th>種別</th><th>カテゴリ</th>
          <th>開始日</th><th>終了日</th><th>残日数</th><th>金額</th><th>担当者</th><th>契約ID</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── PDF ──
async function handleDetailDrop(e, contractId) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') await uploadPdfForContract(file, contractId);
}
async function handleDetailPDF(e, contractId) {
  const file = e.target.files[0];
  if (file) await uploadPdfForContract(file, contractId);
}
async function uploadPdfForContract(file, contractId) {
  showToast('PDFをアップロード中...', 'success');
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${contractId}/${Date.now()}_${safeName}`;
  const { error: upErr } = await db.storage.from('contracts-pdf').upload(path, file);
  if (upErr) { showToast('アップロード失敗: ' + upErr.message, 'error'); return; }
  const { data: urlData } = db.storage.from('contracts-pdf').getPublicUrl(path);
  await db.from('contracts').update({ pdf_url: urlData.publicUrl, pdf_path: path }).eq('id', contractId);
  showToast('PDFをアップロードしました ✓', 'success');
  await loadContracts();
}
async function removePdf(contractId, pdfPath) {
  if (!confirm('PDFを削除しますか？')) return;
  await db.storage.from('contracts-pdf').remove([pdfPath]);
  await db.from('contracts').update({ pdf_url: null, pdf_path: null }).eq('id', contractId);
  showToast('PDFを削除しました', 'success');
  await loadContracts();
}

// ── AUTO CONTRACT ID ──
function generateContractId() {
  const year = new Date().getFullYear();
  const prefix = `CTR-${year}-`;
  const existing = allContracts
    .filter(c => c.contract_id && c.contract_id.startsWith(prefix))
    .map(c => parseInt(c.contract_id.replace(prefix, '')) || 0);
  const maxNum = existing.length > 0 ? Math.max(...existing) : 0;
  return `${prefix}${String(maxNum + 1).padStart(4, '0')}`;
}

function openModal(parentId=null, parentName=null) {
  editingId = null;
  document.getElementById('modal-title').textContent = '＋ 新規契約を追加';
  ['f-name','f-partner','f-assignee','f-notes','f-amount'].forEach(id=>document.getElementById(id).value='');
  ['f-start','f-end'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value='有効';
  document.getElementById('f-type').value=parentId?'個別契約':'基本契約';
  document.getElementById('f-contract-id').value = generateContractId();
  populateParentSelect(parentId);
  document.getElementById('modal').style.display='flex';

function openChildModal(parentId, parentName) {
  openModal(parentId, parentName);
  document.getElementById('modal-title').textContent=`＋ 紐づく契約を追加（${parentName}）`;
}
function openEditModal(id) {
  const c = allContracts.find(x=>x.id===id);
  if (!c) return;
  editingId = id;
  document.getElementById('modal-title').textContent='✏️ 契約を編集';
  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-partner').value=c.partner||'';
  document.getElementById('f-status').value=c.status||'有効';
  document.getElementById('f-type').value=c.contract_type||'基本契約';
  document.getElementById('f-amount').value=c.amount||'';
  document.getElementById('f-start').value=c.start_date||'';
  document.getElementById('f-end').value=c.end_date||'';
  document.getElementById('f-assignee').value=c.assignee||'';
  document.getElementById('f-contract-id').value=c.contract_id||'';
  document.getElementById('f-notes').value=c.notes||'';
  document.getElementById('f-category').value=c.category||'その他契約類';
  populateParentSelect(c.parent_id);
  document.getElementById('modal').style.display='flex';
}
function populateParentSelect(selectedParentId=null) {
  const sel = document.getElementById('f-parent');
  sel.innerHTML='<option value="">なし（独立した契約）</option>';
  allContracts.filter(c=>!c.parent_id&&c.id!==editingId).forEach(c=>{
    const opt=document.createElement('option');
    opt.value=c.id; opt.textContent=c.name;
    if(c.id===selectedParentId) opt.selected=true;
    sel.appendChild(opt);
  });
}
function closeModal() { document.getElementById('modal').style.display='none'; }
function closeModalOutside(e) { if(e.target.id==='modal') closeModal(); }

async function saveContract() {
  const name=document.getElementById('f-name').value.trim();
  const partner=document.getElementById('f-partner').value.trim();
  if(!name||!partner){showToast('契約名と契約者は必須です','error');return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='保存中...';
  const parentVal=document.getElementById('f-parent').value;
  const payload={
    name,partner,
    contract_type:document.getElementById('f-type').value,
    status:document.getElementById('f-status').value,
    amount:document.getElementById('f-amount').value?parseInt(document.getElementById('f-amount').value):null,
    start_date:document.getElementById('f-start').value||null,
    end_date:document.getElementById('f-end').value||null,
    assignee:document.getElementById('f-assignee').value.trim()||null,
    contract_id:document.getElementById('f-contract-id').value.trim()||null,
    notes:document.getElementById('f-notes').value.trim()||null,
    parent_id:parentVal||null,
    category:document.getElementById('f-category').value,
  };
  let error;
  if(editingId){({error}=await db.from('contracts').update(payload).eq('id',editingId));}
  else{({error}=await db.from('contracts').insert(payload));}
  if(error){showToast('保存失敗: '+error.message,'error');btn.disabled=false;btn.textContent='保存する';return;}
  showToast(editingId?'契約を更新しました ✓':'契約を追加しました ✓','success');
  closeModal(); btn.disabled=false; btn.textContent='保存する';
  await loadContracts();
}

async function deleteContract(id) {
  if(!confirm('この契約を削除しますか？'))return;
  const c=allContracts.find(x=>x.id===id);
  if(c?.pdf_path) await db.storage.from('contracts-pdf').remove([c.pdf_path]);
  await db.from('contracts').delete().eq('id',id);
  showToast('削除しました','success');
  selectedId=null;
  document.getElementById('detail-panel').innerHTML='<div class="empty-state"><div class="icon">📄</div><p>契約を選択してください</p></div>';
  await loadContracts();
}

function exportCSV() {
  const headers=['契約名','カテゴリ','種別','契約者','ステータス','金額','開始日','終了日','担当者','契約ID'];
  const rows=allContracts.map(c=>[c.name,c.category||'',c.contract_type||'',c.partner,c.status,c.amount||'',c.start_date||'',c.end_date||'',c.assignee||'',c.contract_id||'']);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`contracts_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  showToast('CSV出力しました','success');
}

function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/(1000*60*60*24));}
function formatDate(s){if(!s)return'—';const d=new Date(s);return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function formatDateShort(s){if(!s)return'—';const d=new Date(s);return`${d.getMonth()+1}/${d.getDate()}`;}
function statusIcon(s){return{'有効':'✅','更新要':'⚠️','期限切れ':'❌'}[s]||'📄';}
function statusBg(s){return{'有効':'rgba(5,150,105,0.1)','更新要':'rgba(217,119,6,0.1)','期限切れ':'rgba(239,68,68,0.1)'}[s]||'rgba(85,94,118,0.1)';}
function statusPill(s){return{'有効':'pill-green','更新要':'pill-orange','期限切れ':'pill-red'}[s]||'pill-gray';}



// 自動ステータス判定（180日前→更新要、期限切れ）
function calcAutoStatus(c) {
  if (!c.end_date) return '有効';
  const days = daysUntil(c.end_date);
  if (days < 0) return '期限切れ';
  if (days <= 180) return '更新要';
  return '有効';
}

async function autoUpdateStatuses(contracts) {
  const updates = contracts.filter(c => {
    if (!c.end_date) return false;
    return calcAutoStatus(c) !== c.status;
  });
  if (updates.length === 0) return;
  await Promise.all(updates.map(c =>
    db.from('contracts').update({ status: calcAutoStatus(c) }).eq('id', c.id)
  ));
  updates.forEach(c => { c.status = calcAutoStatus(c); });
  showToast(updates.length + '件のステータスを自動更新しました', 'success');
}
function showToast(msg,type='success'){
  const t=document.createElement('div');t.className=`toast ${type}`;
  t.innerHTML=`<span>${type==='success'?'✅':'❌'}</span> ${msg}`;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}
